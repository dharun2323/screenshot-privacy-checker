<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screenshot Privacy Checker</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #1a2a6c, #b21f1f, #fdbb2d);
      animation: bgMove 8s infinite alternate;
    }

    @keyframes bgMove {
      from { background-position: 0% 50%; }
      to { background-position: 100% 50%; }
    }

    .glass {
      width: 460px;
      padding: 35px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      text-align: center;
      animation: pop 0.8s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      color: #fff;
      font-size: 28px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #eee;
      font-size: 14px;
      margin-bottom: 25px;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.85);
      margin-bottom: 18px;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #ff512f, #dd2476);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .result {
      margin-top: 25px;
      padding: 18px;
      border-radius: 14px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      text-align: left;
      animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .danger {
      border-left: 5px solid #ff4b5c;
    }

    .safe {
      border-left: 5px solid #2ecc71;
    }

    .result h3 {
      margin-bottom: 10px;
      font-size: 18px;
    }

    ul {
      margin-left: 20px;
    }

    li {
      margin-bottom: 6px;
    }

    footer {
      margin-top: 22px;
      font-size: 12px;
      color: #ddd;
      text-align: center;
      opacity: 0.85;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,0.25);
      font-size: 12px;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="glass">
    <h1>🔐 Screenshot Privacy Checker</h1>
    <div class="subtitle">AI-Powered OCR • Privacy Protection System</div>

    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="screenshot" required />
      <button type="submit">Scan Screenshot</button>
    </form>

    <!-- 🔥 DYNAMIC RESULT (BACKEND CONTROLLED) -->
    {% if result %}
      <div class="result {{ 'danger' if detected else 'safe' }}">
        <h3>{{ result }}</h3>

        {% if detected %}
          <ul>
            {% for item in detected %}
              <li>{{ item }}</li>
            {% endfor %}
          </ul>
          <span class="badge">High Risk</span>
        {% else %}
          <span class="badge">Low Risk</span>
        {% endif %}
      </div>
    {% endif %}

    <footer>
      Final Year Mini Project • Flask + Tesseract OCR
    </footer>
  </div>

</body>
</html>
